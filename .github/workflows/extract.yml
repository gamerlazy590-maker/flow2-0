name: Extract project ZIP
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project files
        run: |
          unzip -o flow2-0-project.zip
          if [ -d flow2-0 ]; then
            shopt -s dotglob
            mv flow2-0/* .
            rmdir flow2-0
          fi
          rm -f flow2-0-project.zip
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "gamerlazy590-maker"
          git config user.email "gamerlazy590@gmail.com"
          git add -A
          git commit -m "Add Flow 2.0 project files" || echo "nothing to commit"
          git push
